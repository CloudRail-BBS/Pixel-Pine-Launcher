name: Release

# 只有打版本标签（vX.Y.Z）才会打包发版。
# 普通提交只走 CI（fmt / clippy / test / 编译检查），不产物、不发 Release——
# 免得每推一次代码就多一个「看起来能用」的安装包。
#
# 安装包不在本地构建：签名密钥与产物都留在 CI，谁都能复现同一份二进制。

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 先校验再烧机器：四个构建任务各自跑十分钟才因为标签写错失败，太浪费
  verify:
    name: 校验标签与版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 标签和版本号对不上就早点停下：
      # 打错标签的代价是发出去一个版本号错误的安装包，
      # 而自动更新是拿版本号比大小的，错了会引发一堆「为什么更新不了」。
      - name: 校验标签与版本号
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签 $tag 不是 vX.Y.Z 形式，拒绝打包"
            exit 1
          fi

          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./apps/desktop/package.json').version")

          if [[ "$tag" != "v$conf" ]]; then
            echo "::error::标签 $tag 与 tauri.conf.json 的版本 $conf 不一致"
            exit 1
          fi
          if [[ "$conf" != "$pkg" ]]; then
            echo "::error::tauri.conf.json ($conf) 与 package.json ($pkg) 版本不一致"
            exit 1
          fi
          if [[ ! -f docs/RELEASE_NOTES.md ]]; then
            echo "::error::缺少 docs/RELEASE_NOTES.md——Release 说明与 latest.json 都从这里取"
            exit 1
          fi

          echo "版本校验通过：$tag"

  build:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # 一个平台挂掉不影响其他平台继续出包：
    # Linux 少个 webkit 依赖不该让 Windows 的安装包也发不出去
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64

          # 固定在 22.04 而不是 ubuntu-latest：产物要跑在用户机器上，
          # glibc 版本由构建机决定，24.04 上打出来的包在 22.04 及更老的发行版直接报错
          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x64

          # 两个 macOS 任务都在 arm64 机器上跑，Intel 那份靠 rustup 交叉编译：
          # macos-13 是最后一批 Intel 镜像，迟早下线，交叉编译反而更稳
          - label: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64
            arch: aarch64

          - label: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            build-essential \
            curl wget file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # 交叉编译的目标要分开缓存，否则 arm64 / x64 会互相冲掉
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci

      - name: 构建（上游资源抖动时自动重试）
        working-directory: apps/desktop
        env:
          # 自更新签名：少了这个变量，带 createUpdaterArtifacts 的构建会直接失败。
          # 变量内容就是 .key 文件的全文，不是路径。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 没有 Apple 开发者证书，只能出未签名包（首次打开需要用户自己绕过 Gatekeeper）。
          # 这里必须显式写 "-"（ad-hoc 签名），不能用空串：
          # 空串会被当成「用名为空的身份签名」，codesign 直接报 no identity found 然后整个打包失败。
          APPLE_SIGNING_IDENTITY: "-"
        # 打包会现下 NSIS / linuxdeploy / AppRun，GitHub 资源偶尔 504 且 tauri 不重试。
        # 重试只是重新打包（Rust 产物已就绪），几十秒。
        run: node ../../scripts/build-bundles.mjs --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      # tauri 把 macOS 更新包固定命名成 `<产品名>.app.tar.gz`，两个架构撞名，
      # 传到 artifact 里会互相覆盖——latest.json 里就只剩一个 Mac 能更新。
      - name: macOS 更新包补架构后缀
        if: matrix.arch
        shell: bash
        working-directory: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos
        run: |
          for f in *.app.tar.gz; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.app.tar.gz}_${{ matrix.arch }}.app.tar.gz"
          done
          for f in *.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.app.tar.gz.sig}_${{ matrix.arch }}.app.tar.gz.sig"
          done
          ls -l

      # 只收安装包和签名，不收 `.app` 目录与中间产物——
      # artifact 按体积计费，几百 MB 的目录树没必要传
      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # 发版集中在一个任务里做：四个平台各自 create release 会互相覆盖，
  # 尤其是 latest.json——被后完成的任务整份重写，就少一个平台的更新条目
  publish:
    name: 汇总发布
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # download-artifact 会保留「相对于公共祖先」的路径（dist/nsis/xxx.exe），
      # 摊平再上传：gh release 拿目录会报错，而且更难看
      - name: 摊平产物
        run: |
          find dist -mindepth 2 -type f -exec mv -f {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          ls -lh dist

      - name: 生成 latest.json
        run: |
          node scripts/make-latest-json.mjs \
            --dir dist \
            --version "${GITHUB_REF_NAME#v}" \
            --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file docs/RELEASE_NOTES.md \
            --out dist/latest.json

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Pixel-Pine-Launcher $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease \
            dist/*
