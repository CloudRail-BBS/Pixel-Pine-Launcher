name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: 内核（fmt / clippy / test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        # junction 与 winreg 只在 Windows 下编译，Linux CI 上走 cfg 分支
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试
        run: cargo test --workspace

  web:
    name: 前端（类型检查 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - run: npm ci
      - run: npm run build

  # Android 源码也进 CI：本地没有 Android SDK 时，Kotlin 写错了只有打 tag
  # 才会暴露，而那时候标签已经推出去了。这里只编译，不发产物。
  android:
    name: Android（编译）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 编译 debug APK
        working-directory: apps/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

  # 只看「能不能在三个平台上编出来」。
  # 目的是让 cfg 写错（Windows 专属 API 漏了门）在打 tag 之前就炸，
  # 而不是等发版跑到一半发现 macOS 编译不过、tag 已经推上去了。
  desktop:
    name: 客户端（${{ matrix.label }} 编译）
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
          - label: Linux
            os: ubuntu-22.04
          - label: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 构建前端
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      # `generate_context!` 会在这个阶段把前端产物编进二进制，
      # 所以必须先把 dist 建出来，否则 check 会因为找不到 frontendDist 失败
      - name: 编译检查
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

  server:
    name: 服务端（check / clippy）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 构建
        run: cargo build --release
