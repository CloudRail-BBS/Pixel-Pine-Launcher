[workspace]
resolver = "3"
members = ["crates/ppl-package", "crates/ppl-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Pixel-Pine-Launcher Contributors"]
repository = "https://github.com/CloudRail-BBS/Pixel-Pine-Launcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
