name: ppl

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ppl}
      POSTGRES_USER: ${POSTGRES_USER:-ppl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppl_dev_only}
    volumes:
      - ppl-db:/var/lib/postgresql/data
    healthcheck:
      # 用 pg_isready 而不是 curl：镜像里没有 curl，也不该为了探活装一个
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppl} -d ${POSTGRES_DB:-ppl}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # 只在需要从宿主机连库调试时开放，生产建议删掉
    ports:
      - "${PPL_DB_PORT:-5432}:5432"

  server:
    build:
      context: ./apps/server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 容器内网用服务名 db，不是 localhost
      DATABASE_URL: postgres://${POSTGRES_USER:-ppl}:${POSTGRES_PASSWORD:-ppl_dev_only}@db:5432/${POSTGRES_DB:-ppl}
      # 容器内固定 8080，宿主机端口由 ports 映射决定
      PPL_PORT: "8080"
      PPL_DB_MAX_CONN: "8"
      # 资源包存卷里，容器重建不丢内容
      PPL_STORAGE_DIR: /data/packages
      PPL_PUBLIC_BASE: ${PPL_PUBLIC_BASE:-http://localhost:8080}
      PPL_JWT_SECRET: ${PPL_JWT_SECRET:-}
      PPL_JWT_TTL_HOURS: ${PPL_JWT_TTL_HOURS:-168}
      PPL_ADMIN_EMAIL: ${PPL_ADMIN_EMAIL:-}
      PPL_SMTP_HOST: ${PPL_SMTP_HOST:-}
      PPL_SMTP_PORT: ${PPL_SMTP_PORT:-465}
      PPL_SMTP_USER: ${PPL_SMTP_USER:-}
      PPL_SMTP_PASS: ${PPL_SMTP_PASS:-}
      PPL_SMTP_FROM: "${PPL_SMTP_FROM:-PPL 市场 <noreply@pixelpine.org>}"
      PPL_GEETEST_ID: ${PPL_GEETEST_ID:-}
      PPL_GEETEST_KEY: ${PPL_GEETEST_KEY:-}
      # 生产必须为 0
      PPL_DEV_MODE: ${PPL_DEV_MODE:-0}
      RUST_LOG: ${RUST_LOG:-info,tower_http=warn}
    volumes:
      - ppl-files:/data/packages
    ports:
      - "${PPL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ppl-db:
  ppl-files:
