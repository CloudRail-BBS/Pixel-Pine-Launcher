[package]
name = "ppl-desktop"
version = "0.1.0"
description = "Pixel-Pine-Launcher 桌面壳"
edition = "2021"
rust-version = "1.82"

# 独立 workspace：src-tauri 有自己的构建目标，跟仓库根的内核 workspace 分开
[workspace]

[lib]
# 与 bin 同名会导致 pdb 输出文件名冲突，加 _lib 后缀区分
name = "ppl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ppl-core = { path = "../../../crates/ppl-core" }
tauri-plugin-dialog = "2.7.3"
# 市场下载用。rustls 而不是 native-tls：Windows 上少一个 OpenSSL 依赖
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
